services:
  keyvault:
    build: .
    container_name: keyvault
    restart: unless-stopped
    environment:
      # Generate: openssl rand -hex 32
      MASTER_KEY: "REPLACE_WITH_64_HEX_CHARS"
      DATA_DIR: /data
    volumes:
      - keyvault-data:/data
    networks:
      - traefik-net

volumes:
  keyvault-data:

networks:
  traefik-net:
    external: true
